name: CI
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      # tee so a failure can be summarised in the annotations below, while
      # pipefail keeps the real exit status.
      - run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e.log
      # Surface the failing test names as annotations, so a failure can be read
      # from the checks API without downloading the artifact.
      - name: Summarise e2e failures
        if: failure()
        run: |
          {
            echo '### Playwright failures'
            echo '```'
            grep -E '^\s+(✘|×|[0-9]+\))' -A 4 e2e.log | head -n 200 || tail -n 60 e2e.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^\s+[0-9]+\) ' e2e.log | head -n 10 | while read -r line; do
            echo "::error title=Playwright failure::$line"
          done
          grep -E 'Error: expect' e2e.log | head -n 10 | while read -r line; do
            echo "::error title=Playwright assertion::$line"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
